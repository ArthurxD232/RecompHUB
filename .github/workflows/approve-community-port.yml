name: Aprovação Automática de Port da Comunidade

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  approve-and-publish:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Processar e Publicar Port no community-ports.json
        id: process_port
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import sys

          issue_body = os.environ.get('ISSUE_BODY', '')
          issue_number = os.environ.get('ISSUE_NUMBER', '')
          sender = os.environ.get('ISSUE_SENDER', '')

          # Regex para extrair payload JSON embutido na Issue
          pattern = r'```json\s*<!--\s*RECOMPHUB_COMMUNITY_PORT_PAYLOAD\s*([\s\S]*?)-->\s*```'
          match = re.search(pattern, issue_body)

          if not match:
              print("::error::Nenhum bloco de dados RECOMPHUB_COMMUNITY_PORT_PAYLOAD encontrado na Issue.")
              sys.exit(1)

          raw_json_str = match.group(1).strip()
          try:
              port_data = json.loads(raw_json_str)
          except Exception as e:
              print(f"::error::Erro ao analisar JSON do port: {e}")
              sys.exit(1)

          ports_file_path = "data/community-ports.json"
          if not os.path.exists(ports_file_path):
              ports_list = []
          else:
              with open(ports_file_path, "r", encoding="utf-8") as f:
                  try:
                      ports_list = json.load(f)
                  except Exception:
                      ports_list = []

          # Atualiza timestamp de aprovação e nível
          from datetime import datetime, timezone
          port_data["approvedAt"] = datetime.now(timezone.utc).isoformat()
          port_data["verificationLevel"] = port_data.get("verificationLevel", "community")

          port_id = port_data.get("id")
          existing_index = next((i for i, p in enumerate(ports_list) if p.get("id") == port_id), -1)

          if existing_index >= 0:
              print(f"Atualizando port existente: {port_id}")
              ports_list[existing_index] = port_data
          else:
              print(f"Inserindo novo port: {port_id}")
              ports_list.append(port_data)

          # Ordena por título
          ports_list.sort(key=lambda x: x.get("title", "").lower())

          os.makedirs("data", exist_ok=True)
          with open(ports_file_path, "w", encoding="utf-8") as f:
              json.dump(ports_list, f, indent=2, ensure_ascii=False)

          # Salva dados para os steps seguintes
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"port_title={port_data.get('title')}\n")
              out.write(f"port_project={port_data.get('projectName')}\n")
          EOF
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_SENDER: ${{ github.event.sender.login }}

      - name: Commit e Push das Alterações
        run: |
          git config --global user.name "RecompHUB Bot"
          git config --global user.email "bot@recomphub.launcher"
          git add data/community-ports.json
          git commit -m "feat(community): adiciona port ${{ steps.process_port.outputs.port_title }} (${{ steps.process_port.outputs.port_project }}) [skip ci]" || echo "Nenhuma alteração a commitar"
          git push origin main

      - name: Comentar e Fechar Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const portTitle = process.env.PORT_TITLE;
            const portProject = process.env.PORT_PROJECT;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🎉 **Port Aprovado e Publicado com Sucesso!**\n\nO port **${portTitle} (${portProject})** foi aprovado e integrado ao catálogo oficial do RecompHUB.\n\nEle já está visível na aba **Comunidade** para todos os usuários do aplicativo, pronto para ser instalado com 1 clique.\n\nObrigado pela contribuição à comunidade de recompilação! 🚀`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
        env:
          PORT_TITLE: ${{ steps.process_port.outputs.port_title }}
          PORT_PROJECT: ${{ steps.process_port.outputs.port_project }}
