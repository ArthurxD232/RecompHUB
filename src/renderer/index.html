<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecompHUB — 1-Click Decomp &amp; Static Recomp PC Launcher (beta-0.2)</title>
    <style>
      /* Tela de abertura mínima: aparece no primeiro quadro, antes do JavaScript carregar */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171a21;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 35%, #223247 0%, #171a21 62%);
        color: #dcdedf;
        font-family: 'Segoe UI', 'Noto Sans', system-ui, sans-serif;
      }
      #boot .logo {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 0.06em;
      }
      #boot .logo b {
        color: #1a9fff;
      }
      #boot .bar {
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: #243245;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #06bfff, #2d73ff);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(380%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="bg-[#171a21] text-zinc-100 antialiased selection:bg-blue-500/30 selection:text-blue-200 overflow-hidden">
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div class="logo">Recomp<b>HUB</b></div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
